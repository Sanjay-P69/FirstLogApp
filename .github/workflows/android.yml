name: Android checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check presentation boundaries
        run: python3 scripts/check_architecture.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Install project Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build, unit tests, and lint
        run: bash gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace
      - name: Print lint failures
        if: failure()
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path('app/build/reports/lint-results-debug.xml')
          if report.exists():
              for issue in ET.parse(report).getroot().findall('issue'):
                  if issue.get('severity') in ('Error', 'Fatal'):
                      print(issue.get('id'), issue.get('message'))
                      for location in issue.findall('location'):
                          print(location.attrib)
          else:
              import json
              sarif = Path('app/build/reports/lint-results-debug.sarif')
              if sarif.exists():
                  for run in json.loads(sarif.read_text()).get('runs', []):
                      for result in run.get('results', []):
                          if result.get('level') == 'error':
                              print(result.get('ruleId'), result.get('message'), result.get('locations'))
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/outputs/apk/debug/*.apk
