name: Android checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Spotless ratchet needs the baseline commit.
          persist-credentials: false
      - name: Check presentation boundaries
        run: python3 scripts/check_architecture.py
      - name: Test reproducibility verifier behavior
        run: python3 scripts/test_verify_reproducible.py
      - name: Ensure formatting baseline is available after squash merges
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git cat-file -e '4b699abb1a2271335578a3c736691d6c3b50c073^{commit}' 2>/dev/null; then
            git -c 'credential.helper=!f() { printf "%s\n" "username=x-access-token" "password=$GH_TOKEN"; }; f' fetch --no-tags origin 4b699abb1a2271335578a3c736691d6c3b50c073
          fi
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21.0.8+9.0.LTS'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Install project Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compare two clean unsigned release builds
        run: python3 scripts/verify_reproducible.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reproducibility-${{ github.sha }}
          retention-days: 14
          path: reproducibility-output/
      - name: Kotlin formatting and static analysis
        run: bash gradlew spotlessCheck detekt --stacktrace
      - name: Build debug and release, both unit-test variants, and both lint variants
        run: >-
          bash gradlew :app:assembleDebug :app:assembleRelease
          :app:assembleDebugAndroidTest
          :app:testDebugUnitTest :app:testReleaseUnitTest
          :app:lintDebug :app:lintRelease --stacktrace
      - name: Print lint errors
        if: failure()
        run: |
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for report in Path('app/build/reports').glob('lint-results-*.xml'):
              for issue in ET.parse(report).getroot().findall('issue'):
                  if issue.get('severity') in ('Error', 'Fatal'):
                      print(report.name, issue.attrib, [node.attrib for node in issue.findall('location')])
          for report in Path('app/build/reports').glob('lint-results-*.sarif'):
              for run in json.loads(report.read_text()).get('runs', []):
                  for issue in run.get('results', []):
                      if issue.get('level') == 'error':
                          print(report.name, issue.get('ruleId'), issue.get('message'), issue.get('locations'))
          PYCODE
      - name: Show formatting patch when checks fail
        if: failure()
        run: |
          bash gradlew spotlessApply --stacktrace || true
          git diff -- app/src
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-builds-and-reports
          retention-days: 14
          path: |
            app/build/reports/
            build/reports/
            app/build/outputs/apk/debug/*.apk
